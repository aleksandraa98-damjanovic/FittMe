<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom — Training & Nutrition</title>
<style>
:root{--bg:#fff;--card:#f6f9f5;--line:#e3ebe1;--tx:#1f2a22;--mut:#6b7a6f;--g:#7fb48a;--sage:#a9c1a5;--gd:#4f8a5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111513;--card:#1b211e;--line:#2a332d;--tx:#eceee9;--mut:#9aa89d;--g:#7fb48a;--sage:#6f8a6c;--gd:#9fd0aa}}
:root[data-theme="dark"]{--bg:#111513;--card:#1b211e;--line:#2a332d;--tx:#eceee9;--mut:#9aa89d;--g:#7fb48a;--sage:#6f8a6c;--gd:#9fd0aa}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:26px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g);border-radius:8px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--gd);border:1px solid var(--sage)}button.x{background:none;color:var(--mut);padding:4px 8px}button:disabled{opacity:.5}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.pill{flex:0 0 auto;padding:8px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--tx)}.pill.on{background:var(--g);color:#fff;border-color:var(--g)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mut);font-size:11px;padding:6px 0;border-radius:10px;font-weight:500}nav button span{display:block;font-size:20px}nav button.on{color:var(--gd);font-weight:700}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}.chart div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.chart b{display:block;background:var(--sage);border-radius:8px 8px 0 0;min-height:2px}
.demo{background:var(--card);border:1px dashed var(--sage);border-radius:14px;padding:8px 12px;font-size:12px;color:var(--mut);margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 22px;gap:6px}.cal .wk{color:var(--gd);font-weight:700;align-self:center;text-align:center;font-size:16px}.cal span{font-size:11px;color:var(--mut);text-align:center}.cd{aspect-ratio:1;padding:0;border-radius:10px;font-size:13px;color:#1f2a22}.cd.gn{background:var(--g)}.cd.rd{background:#e39a92}.cd.yl{background:#ecd283}.cd.gy{background:var(--line);color:var(--mut)}.cd.fut{background:none;border:1px dashed var(--line);color:var(--mut)}.cd.sel{outline:2px solid var(--tx);outline-offset:1px}.cd.wh{background:var(--bg);border:1px solid var(--sage);color:var(--tx)}.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin:10px 0}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
</style>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bloom"><meta name="theme-color" content="#7fb48a"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head>

<script>

{id:1,n:"Ovsene pahuljice",k:370,p:13,c:60,f:7},{id:2,n:"Grčki jogurt",k:97,p:9,c:4,f:5},
{id:3,n:"Pileća prsa",k:165,p:31,c:0,f:3.6},{id:4,n:"Pirinač (kuvan)",k:130,p:2.7,c:28,f:.3},
{id:5,n:"Jaje",k:143,p:13,c:1,f:10},{id:6,n:"Banana",k:89,p:1.1,c:23,f:.3},
{id:7,n:"Losos",k:208,p:20,c:0,f:13},{id:8,n:"Avokado",k:160,p:2,c:9,f:15},
{id:9,n:"Brokoli",k:34,p:2.8,c:7,f:.4},{id:10,n:"Bademi",k:579,p:21,c:22,f:50},
{id:11,n:"Integralni hleb",k:247,p:13,c:41,f:4},{id:12,n:"Sočivo (kuvano)",k:116,p:9,c:20,f:.4}];
var MEALS=["Doručak","Ručak","Večera","Užina"],TYPES=["Snaga","Trčanje","Joga","Hodanje","Plivanje","Biciklizam"];

function dk(o){var d=new Date();d.setDate(d.getDate()+(o||0));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var uid=100,tab="home";

var log=[],work=[],weights=[{d:dk(-6),w:64.2},{d:dk(-3),w:63.9},{d:dk(0),w:63.6}];
for(var o=0;o>=-6;o--){var dd=dk(o);log.push({id:uid++,d:dd,m:"Doručak",fid:1,g:60},{id:uid++,d:dd,m:"Doručak",fid:2,g:150},{id:uid++,d:dd,m:"Ručak",fid:3,g:150},{id:uid++,d:dd,m:"Ručak",fid:4,g:180});if(o<0)log.push({id:uid++,d:dd,m:"Večera",fid:7,g:140},{id:uid++,d:dd,m:"Večera",fid:9,g:150});if(o<0&&o%2==0)log.push({id:uid++,d:dd,m:"Užina",fid:10,g:120})}
work.push({id:uid++,d:dk(0),t:"Snaga",min:45,note:"Noge i core"},{id:uid++,d:dk(-1),t:"Trčanje",min:30,note:"5 km lagano"},{id:uid++,d:dk(-2),t:"Joga",min:40,note:""},{id:uid++,d:dk(-5),t:"Hodanje",min:60,note:""},{id:uid++,d:dk(-4),t:"Hodanje",min:45,note:"Šetnja"});
var plan={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
plan[0]=[{m:"Doručak",fid:1,g:60},{m:"Ručak",fid:3,g:150}];plan[1]=[{m:"Doručak",fid:2,g:200},{m:"Večera",fid:7,g:140}];
var saved=[{name:"Proteinski doručak",items:[{fid:5,g:120},{fid:11,g:60},{fid:8,g:50}]},{name:"Ručak: piletina i pirinač",items:[{fid:3,g:150},{fid:4,g:180},{fid:9,g:100}]}];
var pday=(new Date().getDay()+6)%7;
var wplan=[],planW={},pw=0,calY=new Date().getFullYear(),calM=new Date().getMonth(),calSel=dk(0),ANALYZE_URL="",photo=null,draft=null,pmsg="";
function food(i){return FOODS.filter(function(f){return f.id==i})[0]}
function sum(a){var t={k:0,p:0,c:0,f:0};a.forEach(function(e){var f=e.q?e:food(e.fid),m=e.q?1:e.g/100;t.k+=f.k*m;t.p+=f.p*m;t.c+=f.c*m;t.f+=f.f*m});return t}
function r(x){return Math.round(x)}function r1(x){return Math.round(x*10)/10}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function day(d){return log.filter(function(e){return e.d==d})}
function fopts(){return FOODS.map(function(f){return'<option value="'+f.id+'">'+f.n+'</option>'}).join("")}

function totals(t){return'<div class="mut">'+r(t.k)+' kcal · proteini '+r(t.p)+' g · ugljeni hidrati '+r(t.c)+' g · masti '+r(t.f)+' g</div>'}
function pr(v,g){return'<div class="bar"><i style="width:'+Math.min(100,v/g*100)+'%"></i></div>'}
var views={
home:function(){var t=sum(day(dk(0))),w=work.filter(function(x){return x.d==dk(0)}),mm=0;day(dk(0)).forEach(function(e){});var meals=MEALS.filter(function(m){return day(dk(0)).some(function(e){return e.m==m})}).length;
var C=2*Math.PI*52,off=C*(1-Math.min(1,t.k/goals.k));
return'<h1>Zdravo, '+esc(goals.name)+' 🌿</h1><div class="sub">Današnji pregled</div><div class="card row"><svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="52" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="65" cy="65" r="52" fill="none" stroke="var(--g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 65 65)"/><text x="65" y="64" text-anchor="middle" font-size="24" font-weight="700" fill="var(--tx)">'+r(t.k)+'</text><text x="65" y="84" text-anchor="middle" font-size="12" fill="var(--mut)">od '+goals.k+' kcal</text></svg><div style="flex:1"><div class="mut">Proteini</div><b>'+r(t.p)+' / '+goals.p+' g</b>'+pr(t.p,goals.p)+'<div class="mut" style="margin-top:10px">Ugljeni hidrati '+r(t.c)+' g · Masti '+r(t.f)+' g</div></div></div><div class="grid"><div class="card"><div class="mut">Obroci</div><div class="big">'+meals+'/'+MEALS.length+'</div></div><div class="card"><div class="mut">Treninzi</div><div class="big">'+w.length+'</div><div class="mut">'+w.reduce(function(a,x){return a+x.min},0)+' min</div></div></div>'},
food:function(){var l=day(dk(0));var h='<h1>Ishrana</h1><div class="sub">Danas</div>'+photoCard()+quickCard()+'<div class="card"><h2>Dodaj obrok</h2><select id="fm">'+mopts()+'</select><input id="fq" autocomplete="off" placeholder="Počni da kucaš namirnicu…" value="'+esc(sel.f?food(sel.f).n:"")+'" oninput="fs(\'f\')"><div id="fb"></div><input id="fg" type="number" inputmode="decimal" placeholder="Količina u gramima" oninput="pv()"><div class="mut" id="pvw" style="margin-bottom:8px"></div><button onclick="addFood()">Dodaj</button></div><div class="card"><div class="row"><h2>Dnevnik</h2><button class="sec" onclick="copyY()">Kopiraj jučerašnji</button></div>';
if(!l.length)h+='<div class="mut">Nema unosa.</div>';MEALS.concat(["Ceo dan"]).forEach(function(m){var x=l.filter(function(e){return e.m==m});if(x.length){h+='<div class="mut" style="margin-top:8px"><b>'+m+'</b></div>'+x.map(function(e){return'<div class="item">'+line(e)+'<button class="x" onclick="delF('+e.id+')">✕</button></div>'}).join("")}});
return h+'<div style="margin-top:10px"><b>Ukupno</b>'+totals(sum(l))+'</div></div>'},
plan:function(){var p=plan[pday],h='<h1>Planiranje</h1><div class="sub">Plan za svaki dan</div><div class="pills">'+PD.map(function(n,i){return'<button class="pill'+(i==pday?' on':'')+'" onclick="pday='+i+';go()">'+n+'</button>'}).join("")+'</div><div class="card"><div class="row"><h2>Plan: '+PD[pday]+'</h2><button class="sec" onclick="copyPrev()">Kopiraj prethodni dan</button></div>';
h+=(p.length?p.map(function(e,i){return'<div class="item"><div class="mut" style="width:62px">'+e.m+'</div>'+line(e)+'<button class="x" onclick="plan['+pday+'].splice('+i+',1);go()">✕</button></div>'}).join(""):'<div class="mut">Plan je prazan.</div>')+'<div style="margin-top:8px">'+totals(sum(p))+'</div></div><div class="card"><h2>Dodaj u plan</h2><select id="pm">'+mopts()+'</select><input id="pq" autocomplete="off" placeholder="Počni da kucaš namirnicu…" value="'+esc(sel.p?food(sel.p).n:"")+'" oninput="fs(\'p\')"><div id="pb"></div><input id="pg" type="number" inputmode="decimal" placeholder="Grami"><button onclick="addPlan()">Dodaj</button></div><div class="card"><h2>Sačuvani obroci</h2>';
h+=saved.map(function(s,i){return'<div class="item"><div><b>'+esc(s.name)+'</b>'+totals(sum(s.items))+'</div><button class="sec" onclick="useSaved('+i+')">U plan</button></div>'}).join("");return h+'</div>'},
work:function(){var h='<h1>Treninzi</h1><div class="sub">Evidencija</div><div class="card"><h2>Novi trening</h2><select id="wt">'+TYPES.map(function(t){return'<option>'+t+'</option>'}).join("")+'</select><input id="wm" type="number" inputmode="numeric" placeholder="Trajanje (min)"><textarea id="wn" rows="2" placeholder="Beleške"></textarea><button onclick="addW()">Sačuvaj</button></div><div class="card"><h2>Odrađeno</h2>';
var s=work.slice().sort(function(a,b){return a.d<b.d?1:-1});h+=s.map(function(x){return'<div class="item"><div><b>'+x.t+'</b> · '+x.min+' min<div class="mut">'+x.d+(x.note?' · '+esc(x.note):'')+'</div></div><button class="x" onclick="delW('+x.id+')">✕</button></div>'}).join("");return h+'</div>'},
prog:function(){var ds=[];for(var o=-6;o<=0;o++)ds.push(dk(o));var ks=ds.map(function(d){return sum(day(d)).k}),mx=Math.max.apply(null,ks.concat([goals.k])),wm=ds.map(function(d){return work.filter(function(x){return x.d==d}).reduce(function(a,x){return a+x.min},0)}),wx=Math.max.apply(null,wm.concat([1]));
function ch(v,m,u){return'<div class="chart">'+v.map(function(x,i){return'<div><span>'+(x?r(x):'')+'</span><b style="height:'+(x/m*90)+'px"></b>'+DN[new Date(ds[i]+"T12:00").getDay()]+'</div>'}).join("")+'</div>'}
var avg=r(ks.reduce(function(a,b){return a+b},0)/7),ws=weights.slice().sort(function(a,b){return a.d<b.d?-1:1}),svg="";
if(ws.length>1){var mn=Math.min.apply(null,ws.map(function(x){return x.w}))-.5,mxw=Math.max.apply(null,ws.map(function(x){return x.w}))+.5,pts=ws.map(function(x,i){return(10+i*(280/(ws.length-1)))+","+(70-(x.w-mn)/(mxw-mn)*60)}).join(" ");svg='<svg viewBox="0 0 300 80" width="100%"><polyline points="'+pts+'" fill="none" stroke="var(--g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
return'<h1>Napredak</h1><div class="sub">Poslednjih 7 dana</div><button class="sec" style="width:100%;margin-bottom:12px" onclick="tab=\'cal\';go()">📆 Mesečni kalendar doslednosti</button><div class="card"><h2>Kalorije po danima</h2><div class="mut">Prosek '+avg+' kcal · cilj '+goals.k+'</div>'+ch(ks,mx)+'</div><div class="card"><h2>Trening (min)</h2><div class="mut">'+work.filter(function(x){return x.d>=ds[0]}).length+' treninga ove nedelje</div>'+ch(wm,wx)+'</div><div class="card"><h2>Težina (opciono)</h2>'+svg+'<div class="mut" style="margin:6px 0">Poslednje: '+(ws.length?ws[ws.length-1].w+' kg':'—')+'</div><input id="wk" type="number" step="0.1" inputmode="decimal" placeholder="Težina (kg)"><button onclick="addWt()">Dodaj merenje</button></div>'},
set:function(){function fi(k,l){return'<div class="mut">'+l+'</div><input type="number" value="'+goals[k]+'" onchange="setGoal(\''+k+'\',this.value)">'}
return'<h1>Podešavanja</h1><div class="sub">Ciljevi i profil</div><div class="card"><h2>Profil</h2><div class="mut">Ime</div><input value="'+esc(goals.name)+'" onchange="setGoal(\'name\',this.value)">'+'</div><div class="card"><h2>Dnevni ciljevi</h2>'+fi("k","Kalorije (kcal)")+fi("p","Proteini (g)")+fi("c","Ugljeni hidrati (g)")+fi("f","Masti (g)")+'</div><div class="card"><h2>Nalog</h2><div class="mut" style="margin-bottom:8px">Registracija i prijava još nisu povezane. Biće dodate preko Supabase-a u sledećem koraku.</div><button disabled>Registracija</button> <button class="sec" disabled>Prijava</button></div>'}};
var MN=["Januar","Februar","Mart","April","Maj","Jun","Jul","Avgust","Septembar","Oktobar","Novembar","Decembar"],MAIN=["Doručak","Ručak","Večera"];
function p2(n){return String(n).padStart(2,"0")}
function dinfo(d){var l=day(d),t=sum(l),mt=l.some(function(e){return e.q&&e.m=="Ceo dan"})?3:MAIN.filter(function(m){return l.some(function(e){return e.m==m})}).length,pl=planW[d],wd=work.filter(function(x){return x.d==d}),td=d==dk(0),k=t.k/goals.k,o={t:t,mt:mt,pl:pl,wd:wd};
if(d>dk(0)){o.c="fut";o.why="Dan još nije došao."}
else if(!l.length){o.c="gy";o.why="Nema evidentiranih obroka, nema dovoljno podataka."}
else if(r(t.k)>goals.k){o.c="rd";o.why="Kalorije su iznad cilja ("+r(t.k)+" od "+goals.k+")."}
else if(mt<3){o.c="yl";o.why="Evidentirano je "+mt+" od 3 glavna obroka (doručak, ručak, večera), pa je dan delimično evidentiran."}

else if(pl&&!wd.length){if(td){o.c="yl";o.why="Planirani trening ("+pl.t+") još nije evidentiran."}else{var cv=covered(d);o.c=cv?"wh":"rd";o.why=cv||"Planirani trening ("+pl.t+") nije odrađen."}}
else{o.c="gn";o.why="Kalorijski cilj je ispunjen (unos ne prelazi cilj)"+(pl?" i planirani trening je odrađen.":"; trening nije bio planiran.")}

views.cal=function(){var first=new Date(calY,calM,1),off=(first.getDay()+6)%7,n=new Date(calY,calM+1,0).getDate(),h='<button class="sec" onclick="tab=\'prog\';go()">← Napredak</button><div class="row" style="margin:12px 0"><button class="sec" onclick="calM--;if(calM<0){calM=11;calY--}go()">‹</button><h1 style="margin:0">'+MN[calM]+' '+calY+'</h1><button class="sec" onclick="calM++;if(calM>11){calM=0;calY++}go()">›</button></div><div class="cal">'+PD.map(function(x){return'<span>'+x+'</span>'}).join("")+'<span></span>';

var rows=Math.ceil((off+n)/7);for(var w=0;w<rows;w++){var wds=[];for(var j=0;j<7;j++){var dt=new Date(calY,calM,1-off+w*7+j),key=dt.getFullYear()+"-"+p2(dt.getMonth()+1)+"-"+p2(dt.getDate());wds.push(key);if(dt.getMonth()!=calM)h+='<span></span>';else h+='<button class="cd '+dinfo(key).c+(key==calSel?' sel':'')+'" onclick="calSel=\''+key+'\';go()">'+dt.getDate()+'</button>'}h+=wkOk(wds)?'<span class="wk">✓</span>':'<span></span>'}
h+='</div><div class="lg"><span><i style="background:var(--g)"></i>Ispunjeno</span><span><i style="background:#e39a92"></i>Nije ispunjeno</span><span><i style="background:#ecd283"></i>Delimično</span><span><i style="background:var(--line)"></i>Bez podataka</span><span><i style="background:var(--bg);border:1px solid var(--sage)"></i>Neutralno</span><span>✓ Nedelja u cilju: prosek kalorija do cilja i najmanje 4 treninga</span></div>';
var i2=dinfo(calSel),nm={gn:"Zeleno",rd:"Crveno",yl:"Žuto",gy:"Sivo",fut:"Budući dan",wh:"Belo (neutralno)"}[i2.c];
return h+'<div class="card"><h2>'+calSel.split("-").reverse().join(".")+' · '+nm+'</h2><div>'+r(i2.t.k)+' / '+goals.k+' kcal</div><div>Proteini '+r(i2.t.p)+' / '+goals.p+' g</div><div>Planiran trening: '+(i2.pl?i2.pl.t:"ne")+'</div><div>Odrađeno: '+(i2.wd.length?i2.wd.map(function(x){return x.t+" "+x.min+" min"}).join(", "):"ništa")+'</div><div class="mut" style="margin-top:8px">Razlog: '+i2.why+'</div></div>'};
var sel={f:null,p:null};

async function setGoal(k,v){var col={k:"goal_kcal",p:"goal_protein",c:"goal_carbs",f:"goal_fat",name:"name"}[k],val=k=="name"?v:(+v||0),o={user_id:sess.user.id};o[col]=val;var r=await sb.from("profiles").upsert(o,{onConflict:"user_id"});if(er(r))return;goals[k]=val}
async function newF(x){var q=document.getElementById(x+"q").value.trim(),v=["k","p","c","f"].map(function(k){return parseFloat(document.getElementById(x+"n"+k).value)});if(!q||v.some(function(a){return isNaN(a)||a<0})){alert("Upiši sve četiri vrednosti (0 je dozvoljeno).");return}
var d=await ins("foods",{name:q.charAt(0).toUpperCase()+q.slice(1),kcal:v[0],protein:v[1],carbs:v[2],fat:v[3]});if(!d)return;var r=d[0];FOODS.push({id:1000+r.id,n:r.name,k:+r.kcal,p:+r.protein,c:+r.carbs,f:+r.fat});pickF(x,1000+r.id)}

sb.auth.getSession().then(function(r){sess=r.data.session;if(sess)start();else go()});
